x-common-config: &common-config
  # Run as the host user that owns ~/.nanobot so the bind-mounted persistent
  # state is writable end-to-end. Override with `NANOBOT_UID`/`NANOBOT_GID`
  # when the host user has a non-default UID/GID, e.g.:
  #   NANOBOT_UID=$(id -u) NANOBOT_GID=$(id -g) docker compose up -d
  # Skipping the root privilege-drop path avoids a silent `chown` failure
  # when the bind-mount source is mode 0700 and root inside the container
  # lacks DAC_OVERRIDE to traverse it.
  user: "${NANOBOT_UID:-1000}:${NANOBOT_GID:-1000}"
  # One init per process, owned by the launcher. The image embeds no tini.
  init: true
  build:
    context: .
    dockerfile: Dockerfile
    args:
      NANOBOT_CHANNELS: ${NANOBOT_CHANNELS:-whatsapp}
      VERSION: ${PERCIVAL_IMAGE_VERSION:-0.1.0}
      GIT_SHA: ${PERCIVAL_IMAGE_REVISION:-unknown}
  volumes:
    # Long form with `create_host_path: false`: a missing state directory
    # must fail loudly at `up` time instead of being created by the daemon
    # with root ownership. Prepare it first:
    #   mkdir -p ~/.nanobot && chown "$(id -u):$(id -g)" ~/.nanobot
    - type: bind
      source: ~/.nanobot
      target: /home/nanobot/.nanobot
      bind:
        create_host_path: false
  # Read-only root filesystem. Everything the agent writes goes to the
  # state bind mount above; /tmp is a tmpfs for runtime scratch.
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,mode=1777
  cap_drop:
    - ALL
  # With an explicit root-start override these capabilities let entrypoint.sh chown the bind mount and
  # drop privileges. They are intentionally minimal and combined with
  # `no-new-privileges` below. KILL lets a root init forward signals after
  # the entrypoint drops the child to UID 1000; the child retains no effective caps.
  cap_add:
    - CHOWN
    - SETGID
    - SETUID
    - KILL
  # Prevent the non-root process from regaining capabilities through setuid
  # binaries or file capabilities left inside the container image.
  security_opt:
    - no-new-privileges:true

services:
  # Persistent gateway/API listeners are loopback-bound on the host by default.
  # A non-loopback bind is an explicit deployment choice and must sit behind
  # reviewed TLS, authentication/proxy and firewall controls.
  nanobot-gateway:
    <<: *common-config
    command: ["gateway"]
    # Listen on the container interface so the loopback-only published host
    # ports can reach it. The host bind remains 127.0.0.1 by default.
    environment:
      PERCIVAL_DOCKER_GATEWAY_HOST: 0.0.0.0
    init: true
    stop_grace_period: 60s
    restart: unless-stopped
    ports:
      - "127.0.0.1:18790:18790"
      - "${PERCIVAL_WS_BIND_ADDRESS:-127.0.0.1}:8765:8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18790/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  nanobot-api:
    <<: *common-config
    # Alternate runtime, not a second writer started beside the gateway by default.
    profiles: [api]
    command:
      ["serve", "--host", "0.0.0.0", "-w", "/home/nanobot/.nanobot/api-workspace"]
    init: true
    stop_grace_period: 60s
    # The API reads its mandatory bearer key from config.json. Do not create a
    # restart loop when that key is absent or invalid.
    restart: "no"
    ports:
      - "${PERCIVAL_API_BIND_ADDRESS:-127.0.0.1}:8900:8900"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8900/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  nanobot-cli:
    <<: *common-config
    profiles:
      - cli
    command: ["status"]
    stdin_open: true
    tty: false
