x-common-config: &common-config
  build:
    context: .
    dockerfile: Dockerfile
    args:
      NANOBOT_CHANNELS: ${NANOBOT_CHANNELS:-whatsapp}
      VERSION: ${PERCIVAL_IMAGE_VERSION:-0.3.5}
      GIT_SHA: ${PERCIVAL_IMAGE_REVISION:-unknown}
  volumes:
    - ~/.nanobot:/home/nanobot/.nanobot
  cap_drop:
    - ALL
  # Entrypoint uses these to fix bind-mount ownership and drop to the nanobot user.
  cap_add:
    - CHOWN
    - SETGID
    - SETUID
  # Prevent the non-root process from regaining capabilities through setuid
  # binaries or file capabilities left inside the container image.
  security_opt:
    - no-new-privileges:true

services:
  # Persistent gateway/API listeners are loopback-bound on the host by default.
  # A non-loopback bind is an explicit deployment choice and must sit behind
  # reviewed TLS, authentication/proxy and firewall controls.
  nanobot-gateway:
    <<: *common-config
    command: ["gateway"]
    # Listen on the container interface so the loopback-only published host
    # ports can reach it. The host bind remains 127.0.0.1 by default.
    environment:
      PERCIVAL_DOCKER_GATEWAY_HOST: 0.0.0.0
      PERCIVAL_DOCKER_GATEWAY_TOKEN_ISSUE_SECRET_FILE: /run/secrets/percival-webui-token-issue
    secrets:
      - percival-webui-token-issue
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:18790:18790"
      - "${PERCIVAL_WS_BIND_ADDRESS:-127.0.0.1}:8765:8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18790/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  nanobot-api:
    <<: *common-config
    command:
      ["serve", "--host", "0.0.0.0", "-w", "/home/nanobot/.nanobot/api-workspace"]
    init: true
    # The API reads its mandatory bearer key from config.json. Do not create a
    # restart loop when that key is absent or invalid.
    restart: "no"
    ports:
      - "${PERCIVAL_API_BIND_ADDRESS:-127.0.0.1}:8900:8900"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8900/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  nanobot-cli:
    <<: *common-config
    profiles:
      - cli
    command: ["status"]
    stdin_open: true
    tty: false

secrets:
  percival-webui-token-issue:
    file: ${PERCIVAL_DOCKER_GATEWAY_TOKEN_ISSUE_SECRET_FILE:?Set a private WebUI token-issuance secret file}
