name: Test Suite

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - .agent/**
      - .github/ISSUE_TEMPLATE/**
      - AGENTS.md
      - CLAUDE.md
      - COMMUNICATION.md
      - CONTRIBUTING.md
      - README.md
      - SECURITY.md
      - webui/README.md
  pull_request:
    branches: [main]
    paths-ignore:
      - docs/**
      - .agent/**
      - .github/ISSUE_TEMPLATE/**
      - AGENTS.md
      - CLAUDE.md
      - COMMUNICATION.md
      - CONTRIBUTING.md
      - README.md
      - SECURITY.md
      - webui/README.md

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-22.04
    outputs:
      python_required: ${{ steps.paths.outputs.python_required }}
      webui_required: ${{ steps.paths.outputs.webui_required }}
      tui_required: ${{ steps.paths.outputs.tui_required }}
      docker_required: ${{ steps.paths.outputs.docker_required }}
      mcp_broker_required: ${{ steps.paths.outputs.mcp_broker_required }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Python-relevant changes
        id: paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          python_required=true
          webui_required=true
          tui_required=true
          docker_required=true
          mcp_broker_required=true

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            diff_range="${BASE_SHA}...${HEAD_SHA}"
          else
            diff_range="${BASE_SHA}..${HEAD_SHA}"
          fi

          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null &&
            changed_files="$(git diff --name-only --no-renames "$diff_range")" &&
            [[ -n "$changed_files" ]]; then
            python_required=false
            webui_required=false
            tui_required=false
            docker_required=false
            mcp_broker_required=false

            while IFS= read -r file; do
              case "$file" in
                .github/workflows/*)
                  # A workflow change must exercise every affected execution path.
                  python_required=true
                  webui_required=true
                  tui_required=true
                  docker_required=true
                  mcp_broker_required=true
                  ;;
                Dockerfile.mcp-broker|docker-compose.mcp-broker.yml|nanobot/mcp_docker/*|nanobot/agent/tools/mcp.py|nanobot/config/mcp_docker.py|nanobot/config/schema.py|nanobot/config/loader.py|nanobot/webui/settings_routes.py|nanobot/webui/ws_http.py|tests/mcp_docker/*|scripts/percival-f2-*)
                  python_required=true
                  docker_required=true
                  mcp_broker_required=true
                  ;;
                webui/*|nanobot/channels/*/webui/*)
                  webui_required=true
                  # The Docker image builds and bundles both WebUI trees.
                  docker_required=true
                  ;;
                nanobot/*)
                  # Channel WebUI files were handled by the previous case.
                  python_required=true
                  docker_required=true
                  ;;
                tests/test_docker.sh|scripts/percival-f5-*|scripts/write_docker_ci_manifest.py)
                  docker_required=true
                  ;;
                pyproject.toml|hatch_build.py|scripts/install_channel_dependencies.py)
                  python_required=true
                  docker_required=true
                  ;;
                tests/*|conftest.py|uv.lock|scripts/*)
                  python_required=true
                  ;;
                Dockerfile|Dockerfile.*|.dockerignore|docker-compose*.yml|entrypoint.sh|render-config.json|README.md|LICENSE|THIRD_PARTY_NOTICES.md)
                  docker_required=true
                  ;;
                tui/*)
                  tui_required=true
                  ;;
                docs/*|.agent/*|.github/ISSUE_TEMPLATE/*|AGENTS.md|CLAUDE.md|COMMUNICATION.md|CONTRIBUTING.md|README.md|SECURITY.md|webui/README.md|render.yaml)
                  # Documentation-only changes are already filtered at the event level.
                  ;;
                *)
                  # Keep new or unclassified paths covered until they are categorized.
                  python_required=true
                  webui_required=true
                  tui_required=true
                  docker_required=true
                  ;;
              esac
            done <<< "$changed_files"
          fi

          echo "python_required=$python_required" >> "$GITHUB_OUTPUT"
          echo "webui_required=$webui_required" >> "$GITHUB_OUTPUT"
          echo "tui_required=$tui_required" >> "$GITHUB_OUTPUT"
          echo "docker_required=$docker_required" >> "$GITHUB_OUTPUT"
          echo "mcp_broker_required=$mcp_broker_required" >> "$GITHUB_OUTPUT"

  test:
    name: Python (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.python_required == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum, 3.12
            os: ubuntu-22.04
            python-version: "3.12"
            coverage: false
            # CLI command tests assert exact Rich terminal output; run them
            # serially below so xdist cannot change terminal-width rendering.
            pytest_args: "-n auto --dist loadfile --ignore=tests/cli/test_commands.py"
          - name: latest, 3.14 + coverage
            os: ubuntu-22.04
            python-version: "3.14"
            coverage: true
            pytest_args: "-n auto --dist loadfile --ignore=tests/cli/test_commands.py"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libolm-dev build-essential

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Install channel dependencies
        run: uv run --no-sync python -m scripts.install_channel_dependencies --all-channels

      - name: Verify dependency consistency
        run: uv pip check

      # Channel requirements live in manifests rather than uv.lock. Avoid a
      # later uv run sync pruning the packages installed by the previous step.
      - name: Lint with ruff
        if: matrix.coverage
        run: uv run --no-sync ruff check nanobot tests conftest.py

      - name: Type check with BasedPyright (strict)
        if: matrix.coverage
        run: uv run --no-sync basedpyright

      - name: Run tests with coverage
        if: matrix.coverage
        run: >-
          uv run --no-sync python -m pytest
          ${{ matrix.pytest_args }}
          --cov=nanobot --cov-report=term-missing:skip-covered
          -vv -o faulthandler_timeout=60
          --durations=25 --durations-min=1.0

      - name: Run serial CLI command tests with coverage
        if: matrix.coverage
        run: >-
          uv run --no-sync python -m pytest
          tests/cli/test_commands.py
          --cov=nanobot --cov-append --cov-report=term-missing:skip-covered
          --durations=25 --durations-min=1.0

      - name: Run compatibility tests
        if: ${{ !matrix.coverage }}
        run: >-
          uv run --no-sync python -m pytest
          ${{ matrix.pytest_args }}
          --durations=25 --durations-min=1.0

      - name: Run serial CLI command compatibility tests
        if: ${{ !matrix.coverage }}
        run: >-
          uv run --no-sync python -m pytest
          tests/cli/test_commands.py
          --durations=25 --durations-min=1.0

  webui:
    needs: changes
    if: needs.changes.outputs.webui_required == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Verify npm lockfile
        working-directory: webui
        run: npm ci --ignore-scripts --dry-run

      - name: Install WebUI dependencies
        working-directory: webui
        run: bun install --frozen-lockfile

      - name: Lint WebUI
        working-directory: webui
        run: bun run lint

      - name: Test WebUI
        working-directory: webui
        run: bun run test:coverage

      - name: Build WebUI
        working-directory: webui
        run: bun run build

  tui:
    needs: changes
    if: needs.changes.outputs.tui_required == 'true'
    name: Terminal UI
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install TUI dependencies
        working-directory: tui
        run: bun install --frozen-lockfile

      - name: Check TUI
        working-directory: tui
        run: bun run check

      - name: Test TUI
        working-directory: tui
        run: bun run test

      - name: Test TUI in a real pseudo-terminal
        working-directory: tui
        run: python3 scripts/pty_smoke.py

      - name: Build TUI
        working-directory: tui
        run: bun run build

      - name: Verify licensed Linux release archive
        working-directory: tui
        run: |
          bun scripts/release-notices.ts linux-x64
          python3 scripts/package-release.py linux-x64

  docker:
    needs: changes
    if: needs.changes.outputs.docker_required == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      PERCIVAL_DOCKER_GATEWAY_TOKEN_ISSUE_SECRET_FILE: ${{ runner.temp }}/percival-f5-webui-token

    steps:
      - uses: actions/checkout@v4

      - name: Prepare isolated WebUI token secret
        run: |
          umask 077
          openssl rand -hex 32 > "$PERCIVAL_DOCKER_GATEWAY_TOKEN_ISSUE_SECRET_FILE"
          sudo chown 1000:1000 "$PERCIVAL_DOCKER_GATEWAY_TOKEN_ISSUE_SECRET_FILE"

      - name: Build image with default channel dependencies
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          docker build --platform linux/amd64 --build-arg VERSION="$VERSION" --build-arg GIT_SHA="$GITHUB_SHA" -t percival-gateway:ci .
          docker build --platform linux/amd64 --build-arg VERSION="$VERSION" --build-arg GIT_SHA="$GITHUB_SHA" -f Dockerfile.mcp-broker -t percival-mcp-broker:ci .

      - name: Verify Docker Compose startup and privilege boundary
        env:
          HOME: ${{ runner.temp }}
        run: |
          docker compose run --rm --no-deps --build -T nanobot-cli status
          docker compose run --rm --no-deps -T --entrypoint sh nanobot-cli -s <<'OUTER'
          set -eu
          field() {
            awk -v key="$1:" '$1 == key { print $2 }' /proc/self/status
          }
          test "$(id -u)" = "0"
          test "$(field NoNewPrivs)" = "1"
          setpriv --reuid=nanobot --regid=nanobot --init-groups sh -s <<'INNER'
          set -eu
          field() {
            awk -v key="$1:" '$1 == key { print $2 }' /proc/self/status
          }
          test "$(id -u)" = "1000"
          test "$(field NoNewPrivs)" = "1"
          for capability_set in CapInh CapPrm CapEff CapAmb; do
            test "$(field "$capability_set")" = "0000000000000000"
          done
          INNER
          OUTER
          docker compose -f docker-compose.yml -f docker-compose.bwrap.yml --profile cli \
            config --format json > "${RUNNER_TEMP}/bwrap-compose.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          config = json.loads(Path(os.environ["RUNNER_TEMP"], "bwrap-compose.json").read_text())
          for service_name in ("nanobot-gateway", "nanobot-api", "nanobot-cli"):
              service = config["services"][service_name]
              assert {"CHOWN", "SETGID", "SETUID", "SYS_ADMIN"} <= set(service["cap_add"])
              assert "no-new-privileges:true" in service["security_opt"]
          PY
      - name: Gateway, WebUI, API auth/health and Compose conformance
        run: bash scripts/percival-f5-compose-smoke.sh

      - name: Verify default WhatsApp dependencies
        run: docker run --rm --entrypoint python percival-gateway:ci -c "import neonize, segno"

      - name: Verify runtime dependency permissions
        run: >-
          docker run --rm --user 1000:1000 --entrypoint sh percival-gateway:ci -c
          'test -w /app/.venv && test ! -w /app && test ! -w /app/nanobot &&
          python -m scripts.install_channel_dependencies discord && python -c "import discord"'

      - name: Record gateway and broker build manifests
        run: |
          python3 scripts/write_docker_ci_manifest.py --image percival-gateway:ci --source-sha "$GITHUB_SHA" --lock uv.lock --lock channel-locks --output gateway-build-manifest.json
          python3 scripts/write_docker_ci_manifest.py --image percival-mcp-broker:ci --source-sha "$GITHUB_SHA" --dockerfile Dockerfile.mcp-broker --lock docker/mcp-broker-requirements.lock --output broker-build-manifest.json
      - name: Generate gateway CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: percival-gateway:ci
          format: cyclonedx-json
          output-file: gateway-sbom.cdx.json
          upload-artifact: false
      - name: Generate broker CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: percival-mcp-broker:ci
          format: cyclonedx-json
          output-file: broker-sbom.cdx.json
          upload-artifact: false
      - name: Upload image evidence
        uses: actions/upload-artifact@v4
        with:
          name: docker-evidence-percival-${{ github.sha }}
          path: |
            gateway-build-manifest.json
            broker-build-manifest.json
            gateway-sbom.cdx.json
            broker-sbom.cdx.json
          if-no-files-found: error

  arch:
    name: Python (Arch Linux, pinned)
    needs: changes
    if: needs.changes.outputs.python_required == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      ARCH_IMAGE: archlinux:base-20261004.0.606936@sha256:4e77cf2ea5f410e6f8be5abf93ccf17ce2436e87a138c167208356711a405dbd

    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Prepare pinned Arch caches
        run: mkdir -p "${RUNNER_TEMP}/arch-pacman-cache" "${RUNNER_TEMP}/arch-uv-cache"
      - name: Cache Arch packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/arch-pacman-cache
          key: arch-pacman-20261004-${{ hashFiles('pyproject.toml', 'uv.lock') }}
      - name: Run Python gates in pinned Arch container
        run: |
          uv_bin="$(command -v uv)"
          docker run --rm \
            --mount "type=bind,src=${GITHUB_WORKSPACE},dst=/workspace" \
            --mount "type=bind,src=${RUNNER_TEMP}/arch-pacman-cache,dst=/var/cache/pacman/pkg" \
            --mount "type=bind,src=${RUNNER_TEMP}/arch-uv-cache,dst=/uv-cache" \
            --mount "type=bind,src=${uv_bin},dst=/usr/local/bin/uv,readonly" \
            --workdir /workspace \
            -e UV_CACHE_DIR=/uv-cache \
            -e UV_PROJECT_ENVIRONMENT=/tmp/nanobot-arch-venv \
            "$ARCH_IMAGE" bash -ceu '
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Sy --noconfirm archlinux-keyring
              pacman -Syu --noconfirm base-devel curl git libolm nodejs npm openssh python
              uv python install 3.12
              uv sync --all-extras --dev --python 3.12
              uv run --no-sync python -m scripts.install_channel_dependencies --all-channels
              uv pip check --python /tmp/nanobot-arch-venv/bin/python
              uv run --no-sync ruff check nanobot tests conftest.py
              uv run --no-sync basedpyright
              uv run --no-sync pytest -n auto --dist loadfile --ignore=tests/cli/test_commands.py
              uv run --no-sync pytest tests/cli/test_commands.py
            '

  mcp-broker:
    name: MCP Docker broker smoke (Engine 27.5.1)
    needs: changes
    if: needs.changes.outputs.mcp_broker_required == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      DOCKER_HOST: tcp://127.0.0.1:2375
      DOCKER_TLS_CERTDIR: ""
      F2_SMOKE_PARENT: ${{ runner.temp }}
      F2_GATEWAY_IMAGE: percival-f2-gateway:ci
      F2_BROKER_IMAGE: percival-mcp-broker:ci
    services:
      docker:
        image: docker:27.5.1-dind
        env:
          DOCKER_TLS_CERTDIR: ""
        ports:
          - 2375:2375
        options: >-
          --privileged
          --health-cmd "docker info"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
        volumes:
          - /home/runner/work/_temp:/home/runner/work/_temp

    steps:
      - uses: actions/checkout@v4
      - name: Verify Docker Engine 27.5.1
        run: |
          docker version
          test "$(docker version --format '{{.Server.Version}}')" = "27.5.1"
      - name: Discover daemon socket group
        run: |
          gid="$(docker run --rm --mount type=bind,src=/var/run/docker.sock,dst=/socket alpine:3.20 stat -c %g /socket)"
          echo "F2_DOCKER_SOCKET_GID=$gid" >> "$GITHUB_ENV"
      - name: Fetch fixture sources at reviewed commits
        run: |
          git clone --no-checkout https://github.com/bill-kopp-ai-dev/percival-weather-mcp.git "${RUNNER_TEMP}/weather"
          git clone --no-checkout https://github.com/bill-kopp-ai-dev/percival-osm.git "${RUNNER_TEMP}/osm"
      - name: Build two MCP fixture versions and rollback images
        env:
          F2_WEATHER_REPO: ${{ runner.temp }}/weather
          F2_OSM_REPO: ${{ runner.temp }}/osm
        run: bash scripts/percival-f2-build-fixtures.sh
      - name: Build gateway and broker
        run: |
          docker build -t "$F2_GATEWAY_IMAGE" .
          docker build -f Dockerfile.mcp-broker -t "$F2_BROKER_IMAGE" .
      - name: Exercise gateway + sidecar topology, operations and guards
        run: bash scripts/percival-f2-docker-smoke.sh
      - name: Retain daemon diagnostics on failure
        if: failure()
        run: docker ps -a
